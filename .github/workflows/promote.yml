# Step 3 of a release (RELEASING.md): flip the verified pre-release to latest.
# Started by hand, and only after someone has installed every platform's build
# from the pre-release and played through it — this is the sign-off, and it is
# irreversible: a promoted version is immutable.
#
# The script refuses a release still missing its macOS or Linux artifact. That
# flag is the whole of it: plectrify.com and the README download from
# `/releases/latest/download/<name>`, so they follow it with no commit or deploy.
name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to promote — must equal the VERSION file (e.g. 0.2.0)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    name: Promote to latest
    # release.windows.ts owns promotion; it needs nothing Windows-specific to do
    # it, but runs only there.
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Windows runners check out with core.autocrlf=true, and Prettier (like
      # every other tool here) expects the LF the repository stores.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          native: false

      - name: Promote
        shell: bash
        run: pnpm release --promote --version "${{ inputs.version }}"
